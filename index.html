function down(e){e.preventDefault();let x=e.clientX,y=e.clientY;if(pitPanel&&state==='race'){let b=pitPanelButtons.find(r=>hit(x,y,r));if(b){if(b.key==='close')pitPanel=false;else if(b.key==='tireset')tireChoice=(tireChoice+1)%5;else pitPlan[b.key]=!pitPlan[b.key]}return}if(state==='race'||state==='qual'){if(state==='race'&&buttons.pit&&hit(x,y,buttons.pit)){cars[0].requestedPit=!cars[0].requestedPit;return}if(state==='race'&&buttons.tire&&hit(x,y,buttons.tire)){pitPanel=true;clearControls();touches.clear();return}touches.set(e.pointerId,{x,y});recalcTouches();try{cv.setPointerCapture(e.pointerId)}catch(_){}}else if(state==='menu'){let r=ui.find(r=>hit(x,y,r));if(!r)return;switch(r.key){case'track':track=(track+1)%5;break;case'laps':{let v=prompt('Nombre de tours de course (1 à 100) :',laps);if(v!==null)laps=clamp(parseInt(v)||1,1,100);break;}case'qualLaps':qualLaps=qualLaps>=5?1:qualLaps+1;break;case'difficulty':difficulty=(difficulty+1)%3;break;case'color':choice=r.value;break;case'model':modelChoice=(modelChoice+1)%models.length;break;case'driver':editDriver();break;case'team':chooseTeam();break;case'partner':choosePartner();break;case'weather':weatherChoice=(weatherChoice+1)%4;break;case'tire':tireChoice=(tireChoice+1)%5;break;case'records':state='records';break;case'global':state='global';globalTab=0;fetchGlobal();break;case'free':champ=false;beginQual();break;case'champ':newChamp();break}}else if(state==='qualResults'){beginRace()}else if(state==='results'){if(champ){round++;if(round>=5)state='podium';else{track=round;beginQual()}}else state='menu'}else if(state==='global'){if(y<H*.26){globalTab=clamp(Math.floor((x/W-.04)/.235),0,3)}else if(y>H*.87)state='menu'}else if(state==='podium'||state==='records')state='menu'}
cv.addEventListener('pointerdown',down);cv.addEventListener('pointermove',e=>{if(touches.has(e.pointerId)){touches.set(e.pointerId,{x:e.clientX,y:e.clientY});recalcTouches()}});for(let ev of ['pointerup','pointercancel','lostpointercapture'])cv.addEventListener(ev,e=>{touches.delete(e.pointerId);recalcTouches()});addEventListener('blur',()=>{touches.clear();clearControls()});let keyMap={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'gas',ArrowDown:'brake',a:'left',d:'right',w:'gas',s:'brake',' ':'gas'};addEventListener('keydown',e=>{if(keyMap[e.key]){controls[keyMap[e.key]]=true;e.preventDefault()}});addEventListener('keyup',e=>{if(keyMap[e.key]){controls[keyMap[e.key]]=false;e.preventDefault()}});
function frame(now){let dt=clamp((now-last)/1000,0,.05);last=now;if(state==='race'||state==='qual'){for(let i=0;i<Math.max(1,Math.ceil(dt/.016));i++)step(dt/Math.max(1,Math.ceil(dt/.016)));scene()}else if(state==='menu')menu();else if(state==='results')results();else if(state==='qualResults')qualifyingResults();else if(state==='global')globalScreen();else if(state==='records')recordsScreen();else podium();requestAnimationFrame(frame)}start();state='menu';requestAnimationFrame(frame);
