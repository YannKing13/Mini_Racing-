function menu(){g.fillStyle='#192338';g.fillRect(0,0,W,H);ui=[];label('MINI RACING CHAMPIONSHIP',W/2,H*.08,Math.min(32,H*.075),'#ffdc5c');let items=[['CIRCUIT : '+tracks[track][0],.22,'track'],['TOURS : '+laps,.34,'laps'],['DIFFICULTE : '+['FACILE','NORMAL','DIFFICILE'][difficulty],.46,'difficulty']];for(let [s,y,key] of items){label(s,W/2,H*y,Math.min(25,H*.052));ui.push({key,x:W*.25,y:H*(y-.05),w:W*.5,h:H*.1})}label('GARAGE : CHOISIS TA COULEUR',W/2,H*.56,Math.min(20,H*.04),'#eaf0ff');colors.forEach((color,i)=>{let x=W*(.31+i*.075),y=H*.67;rounded(x-20,y-15,40,30,7,color,choice===i?'white':null);if(choice===i){g.strokeStyle='white';g.lineWidth=2;g.strokeRect(x-24,y-19,48,38)}ui.push({key:'color',value:i,x:x-27,y:y-25,w:54,h:50})});rounded(W*.22,H*.77,W*.25,H*.13,12,'#17614d','#a6f7ca');rounded(W*.53,H*.77,W*.25,H*.13,12,'#344b81','#b9d0ff');label('COURSE LIBRE',W*.345,H*.835,Math.min(21,H*.046));label('CHAMPIONNAT',W*.655,H*.835,Math.min(21,H*.046));ui.push({key:'free',x:W*.22,y:H*.77,w:W*.25,h:H*.13},{key:'champ',x:W*.53,y:H*.77,w:W*.25,h:H*.13})}

function podium(){g.fillStyle='#192338';g.fillRect(0,0,W,H);label('PODIUM DU CHAMPIONNAT',W/2,H*.11,Math.min(36,H*.075),'#ffda5b');let ids=[0,1,2,3,4,5].sort((a,b)=>scores[b]-scores[a]);ids.forEach((id,j)=>label(`${j+1}. ${id===0?'VOUS':'ORDINATEUR '+id} - ${scores[id]} POINTS`,W*.28,H*(.22+j*.105),Math.min(23,H*.047),id===0?colors[choice]:colors.filter((_,k)=>k!==choice)[id-1],'left'));label('TOUCHER POUR REVENIR AU MENU',W/2,H*.94,Math.min(22,H*.046),'#70ffa1')}
function clearControls(){Object.keys(controls).forEach(k=>controls[k]=false)}let touches=new Map();function recalcTouches(){clearControls();for(let p of touches.values())for(let k in buttons)if(hit(p.x,p.y,buttons[k]))controls[k]=true}
function down(e){e.preventDefault();let x=e.clientX,y=e.clientY;if(state==='race'){touches.set(e.pointerId,{x,y});recalcTouches();try{cv.setPointerCapture(e.pointerId)}catch(_){}}else if(state==='menu'){let r=ui.find(r=>hit(x,y,r));if(!r)return;switch(r.key){case'track':track=(track+1)%5;break;case'laps':laps=laps===1?3:laps===3?5:1;break;case'difficulty':difficulty=(difficulty+1)%3;break;case'color':choice=r.value;break;case'free':champ=false;start();break;case'champ':newChamp();break}}else if(state==='results'){if(champ){round++;if(round>=5)state='podium';else{track=round;start()}}else state='menu'}else if(state==='podium')state='menu'}
cv.addEventListener('pointerdown',down);cv.addEventListener('pointermove',e=>{if(touches.has(e.pointerId)){touches.set(e.pointerId,{x:e.clientX,y:e.clientY});recalcTouches()}});for(let ev of ['pointerup','pointercancel','lostpointercapture'])cv.addEventListener(ev,e=>{touches.delete(e.pointerId);recalcTouches()});addEventListener('blur',()=>{touches.clear();clearControls()});let keyMap={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'gas',ArrowDown:'brake',a:'left',d:'right',w:'gas',s:'brake',' ':'gas'};addEventListener('keydown',e=>{if(keyMap[e.key]){controls[keyMap[e.key]]=true;e.preventDefault()}});addEventListener('keyup',e=>{if(keyMap[e.key]){controls[keyMap[e.key]]=false;e.preventDefault()}});
function frame(now){let dt=clamp((now-last)/1000,0,.05);last=now;if(state==='race'){for(let i=0;i<Math.max(1,Math.ceil(dt/.016));i++)step(dt/Math.max(1,Math.ceil(dt/.016)));scene()}else if(state==='menu')menu();else if(state==='results')results();else podium();requestAnimationFrame(frame)}start();state='menu';requestAnimationFrame(frame);
</script></body></html>
